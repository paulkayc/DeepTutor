# Pages CMS settings for The Bridge Help Centre website.
# This file must sit at the TOP of the GitHub repository (next to the
# "bridge-help-centre" folder) and be named ".pages.yml".
# Editor: https://app.pagescms.org

media:
  input: bridge-help-centre/public/images
  output: /images
  categories: [image]
  rename: safe

components:
  # The building blocks for extra pages and Home page extra sections.
  pageBlocks:
    label: Content blocks
    type: block
    list: true
    blocks:
      - name: heading
        label: Heading
        fields:
          - { name: text, label: Heading, type: string }
      - name: text
        label: Text
        fields:
          - name: text
            label: Text
            description: "Leave an empty line between paragraphs. Start a line with - for a bullet. Put **two stars** around words for bold. Web links become clickable."
            type: text
      - name: image
        label: Photo
        fields:
          - { name: src, label: Photo, type: image }
          - { name: alt, label: "Describe the photo (for blind visitors)", type: text }
          - { name: caption, label: Caption (optional), type: string }
          - { name: wide, label: Full width, type: boolean }
      - name: imageText
        label: Photo beside text
        fields:
          - { name: src, label: Photo, type: image }
          - { name: alt, label: "Describe the photo (for blind visitors)", type: text }
          - { name: heading, label: Heading (optional), type: string }
          - { name: text, label: Text, type: text, description: "Same tips as the Text block." }
          - name: imageSide
            label: Photo on the
            type: select
            options:
              values:
                - { value: left, label: Left }
                - { value: right, label: Right }
      - name: gallery
        label: Photo gallery
        fields:
          - name: photos
            label: Photos
            type: object
            list: true
            fields:
              - { name: src, label: Photo, type: image }
              - { name: alt, label: "Describe the photo (for blind visitors)", type: text }
              - { name: caption, label: Caption (optional), type: string }
      - name: quote
        label: Quote
        fields:
          - { name: text, label: Quote, type: text }
          - { name: author, label: "Who said it (optional)", type: string }
      - name: buttons
        label: Buttons
        fields:
          - name: buttons
            label: Buttons
            type: object
            list: true
            fields:
              - { name: label, label: "Button text (e.g. Register now)", type: string }
              - name: link
                label: Link
                description: "A web address (https://…), a page on this site (e.g. /contact/), or WhatsApp: https://wa.me/2349026433052"
                type: string
              - name: style
                label: Style
                type: select
                options:
                  values:
                    - { value: primary, label: "Pink (main)" }
                    - { value: secondary, label: "White (second)" }
      - name: video
        label: Video link
        fields:
          - { name: title, label: "Title (e.g. Highlights from our outreach)", type: string }
          - { name: link, label: "YouTube or Facebook video link", type: string }

content:
  # ---------------------------------------------------------------- events
  - name: events
    label: Upcoming programmes
    description: Events shown on the Home page. Past events hide themselves automatically.
    type: file
    path: bridge-help-centre/src/content/events.json
    format: json
    fields:
      - name: events
        label: Programmes
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.date} — {fields.title}"
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: subtitle, label: Subtitle (optional), type: string }
          - { name: date, label: Date, type: date, required: true }
          - { name: time, label: "Time (e.g. 6:00 PM)", type: string }
          - { name: location, label: "Location (e.g. Online (Google Meet))", type: string }
          - { name: price, label: "Price (e.g. Free)", type: string }
          - { name: speaker, label: Speaker (optional), type: string }
          - { name: description, label: Short description, type: text }
          - { name: image, label: Main image or flyer, type: image }
          - name: imageRatio
            label: Shape of the main image
            type: select
            options:
              values:
                - { value: "4 / 5", label: "Tall flyer (4:5)" }
                - { value: "1 / 1", label: "Square" }
                - { value: "3 / 2", label: "Wide photo (3:2)" }
          - name: slides
            label: Slideshow images (optional — the first event with slides is shown as a slideshow)
            type: object
            list: true
            fields:
              - { name: src, label: Image, type: image }
              - { name: alt, label: "Describe the image (for blind visitors)", type: text }
          - name: speakerBio
            label: About the speaker (one box per paragraph, optional)
            type: text
            list: true
          - name: registerForm
            label: "Registration form link (optional)"
            description: "Paste the link to any online form (e.g. Lovable, Google Forms, Jotform). Visitors open it from the \"Register with our form\" button. Leave empty to show only the WhatsApp button."
            type: string
          - name: registerFormEmbed
            label: Google Forms embed link (optional, Google Forms only)
            description: "Only for Google Forms that should appear inside the page. In Google Forms: Send → the < > tab → copy only the address inside src=\"…\". Leave empty otherwise."
            type: string

  # --------------------------------------------------------------- gallery
  - name: gallery
    label: Gallery
    description: "Photos in \"Moments from Our Work\" on the Home page. The first 8 are shown."
    type: file
    path: bridge-help-centre/src/content/gallery.json
    format: json
    fields:
      - name: photos
        label: Photos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.caption}"
        fields:
          - { name: src, label: Photo, type: image, required: true }
          - { name: alt, label: "Describe the photo (for blind visitors)", type: text, required: true }
          - { name: caption, label: Caption (optional), type: string }
          - name: category
            label: Category
            type: select
            options:
              values: ["School Outreach", "Counselling", "Mentorship", "Community"]

  # -------------------------------------------------------------- services
  - name: services
    label: Our Services
    description: "The services on the Home page, the Our Programmes page and the footer. This is the centre's approved wording, so change it only with the owner's approval."
    type: file
    path: bridge-help-centre/src/content/services.json
    format: json
    fields:
      - name: intro
        label: Introduction (under "Our Services" and at the top of Our Programmes)
        type: text
      - name: services
        label: Services
        description: "Drag to change the order. They are numbered 01, 02… automatically."
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.name}"
        fields:
          - { name: id, label: Web link, type: string, hidden: true }
          - { name: name, label: Service name, type: string, required: true }
          - { name: summary, label: "Short description (Home page card)", type: text }
          - name: bullets
            label: What it includes (one box per point, Our Programmes page)
            type: string
            list: true
          - { name: image, label: "Photo (Our Programmes page, landscape works best)", type: image }
          - { name: imageAlt, label: "Describe the photo (for blind visitors)", type: text }
          - name: icon
            label: Icon
            type: select
            options:
              values:
                - { value: school, label: "School / graduation cap" }
                - { value: counselling, label: "Speech bubble with heart" }
                - { value: learning, label: "Book" }
                - { value: mentorship, label: "Target with arrow" }
                - { value: community, label: "Group of people" }
                - { value: heart, label: "Heart" }
                - { value: handshake, label: "Handshake" }
                - { value: shield, label: "Shield" }
                - { value: spark, label: "Spark" }
                - { value: compass, label: "Compass" }
                - { value: volunteer, label: "Person with plus" }
                - { value: target, label: "Target" }
                - { value: gift, label: "Gift" }
                - { value: user, label: "Person" }
                - { value: calendar, label: "Calendar" }

  # ----------------------------------------------------------------- about
  - name: about
    label: About Us and Director
    type: file
    path: bridge-help-centre/src/content/about.json
    format: json
    fields:
      - name: director
        label: Meet Our Director (Home page)
        type: object
        fields:
          - { name: name, label: Name, type: string }
          - { name: photo, label: Photo, type: image }
          - { name: photoAlt, label: "Describe the photo (for blind visitors)", type: text }
          - { name: bio, label: Biography (one box per paragraph), type: text, list: true }
      - name: story
        label: Our Story (About Us page)
        type: object
        fields:
          - { name: image, label: Photo, type: image }
          - { name: imageAlt, label: "Describe the photo (for blind visitors)", type: text }
          - { name: paragraphs, label: Story (one box per paragraph), type: text, list: true }
      - { name: vision, label: Our Vision, type: text }
      - { name: mission, label: Our Mission, type: text }
      - name: team
        label: Our Team (About Us page)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.name}"
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: role, label: "Role (e.g. Director)", type: string }
          - { name: profession, label: "Profession (e.g. Paediatrician)", type: string }
          - { name: photo, label: Square photo, type: image }
          - { name: photoAlt, label: "Describe the photo (for blind visitors)", type: text }

  # --------------------------------------------------------------- contact
  - name: contact
    label: Contact details, hours and bank details
    description: Used in the header buttons, footer, Contact Us and Get Involved pages.
    type: file
    path: bridge-help-centre/src/content/contact.json
    format: json
    fields:
      - name: phone
        label: Phone / WhatsApp number
        description: "Write it the Nigerian way, e.g. 0902 643 3052. The WhatsApp and call buttons use this number."
        type: string
        required: true
      - { name: email, label: Email address, type: string, required: true }
      - name: hours
        label: Opening hours
        type: object
        list: true
        fields:
          - { name: days, label: "Days (e.g. Mon – Fri)", type: string }
          - { name: time, label: "Time (e.g. 10am – 4pm, or Closed)", type: string }
      - name: address
        label: Address
        type: object
        fields:
          - { name: street, label: Street, type: string }
          - { name: city, label: City, type: string }
          - { name: state, label: State, type: string }
      - name: getInvolvedForm
        label: "Get Involved form link (optional)"
        description: "Paste the link to any online form (e.g. Lovable, Google Forms, Jotform). Visitors open it from an \"Open the form\" button on the Get Involved page. Leave empty to hide that section."
        type: string
      - name: getInvolvedFormEmbed
        label: Google Forms embed link (optional, Google Forms only)
        description: "Only for a Google Form that should appear inside the page. Leave empty otherwise."
        type: string
      - name: bank
        label: Bank details (Get Involved page — leave the account number empty to hide them)
        type: object
        fields:
          - { name: accountName, label: Account name, type: string }
          - { name: accountNumber, label: Account number, type: string }
          - { name: bank, label: Bank, type: string }
      - name: social
        label: Social media links
        description: Facebook, Instagram, X, LinkedIn and WhatsApp get their own icons.
        type: object
        list: true
        fields:
          - { name: name, label: "Name (e.g. Facebook)", type: string }
          - { name: url, label: "Link (starting with https://)", type: string }

  # ----------------------------------------------------------------- stats
  - name: stats
    label: Impact numbers
    description: The counting numbers on the Home page.
    type: file
    path: bridge-help-centre/src/content/stats.json
    format: json
    fields:
      - name: stats
        label: Numbers
        type: object
        list: true
        fields:
          - { name: value, label: "Number (digits only, e.g. 1000)", type: number, required: true }
          - { name: suffix, label: "After the number (e.g. +)", type: string }
          - { name: label, label: "Label (e.g. Young People Reached)", type: string, required: true }

  # ------------------------------------------------------------------ home
  - name: home
    label: Home page top photo
    type: file
    path: bridge-help-centre/src/content/home.json
    format: json
    fields:
      - { name: heroImage, label: "Top photo (wide/landscape)", type: image }
      - { name: heroImageAlt, label: "Describe the photo (for blind visitors)", type: text }

  # -------------------------------------------------------------- settings
  - name: settings
    label: Website settings (statistics and Google)
    description: Only change these when following the setup guide. Leave a box empty to switch it off.
    type: file
    path: bridge-help-centre/src/content/settings.json
    format: json
    fields:
      - name: analyticsToken
        label: Cloudflare Web Analytics token
        description: "From Cloudflare → Analytics & Logs → Web Analytics → your site → Manage site. Copy only the token (the letters and numbers after \"token\": in the snippet)."
        type: string
      - name: googleVerification
        label: Google Search Console code (optional)
        description: "Only needed if you verify with the \"HTML tag\" method. Copy only the code inside content=\"…\"."
        type: string
      - name: bingVerification
        label: Bing Webmaster Tools code (optional)
        description: "Only needed if you verify with the \"HTML Meta Tag\" method. Copy only the code inside content=\"…\"."
        type: string

  # ----------------------------------------------------------- extra pages
  - name: pages
    label: Extra pages
    description: "New pages for the website. The page title becomes its web address, e.g. \"Holiday Camp\" → www.thebridgehelpcentre.org/holiday-camp/. Open \"Example page\" to see every kind of block."
    type: collection
    path: bridge-help-centre/src/content/pages
    format: json
    filename: "{fields.title}.json"
    fields:
      - { name: title, label: Page title, type: string, required: true }
      - name: published
        label: Show this page on the website
        description: Switch off to hide the page without deleting it.
        type: boolean
        default: true
      - name: showInMenu
        label: Show in the top menu
        description: "Up to 2 extra pages fit in the top menu. Every page is also listed at the bottom of the website."
        type: boolean
      - { name: menuLabel, label: "Short name for the menu (optional, e.g. Partners)", type: string }
      - { name: subtitle, label: "Short introduction under the title (optional)", type: text }
      - name: description
        label: "Summary for Google (optional)"
        description: "One or two sentences that Google shows under the page title in search results."
        type: text
      - { name: image, label: "Photo or flyer beside the title (optional)", type: image }
      - { name: imageAlt, label: "Describe that photo (for blind visitors)", type: text }
      - name: blocks
        label: Page content
        component: pageBlocks

  # ------------------------------------------------- home page extra sections
  - name: homeSections
    label: Home page extra sections
    description: "Extra content shown on the Home page, below \"Moments from Our Work\"."
    type: file
    path: bridge-help-centre/src/content/home-sections.json
    format: json
    fields:
      - name: sections
        label: Sections
        component: pageBlocks
