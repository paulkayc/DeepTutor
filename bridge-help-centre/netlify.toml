[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Security and caching headers are written to dist/_headers by the build
# (see security-headers.mjs), which Netlify applies automatically.

# Send the address without "www." to the main address (www.thebridgehelpcentre.org).
[[redirects]]
  from = "https://thebridgehelpcentre.org/*"
  to = "https://www.thebridgehelpcentre.org/:splat"
  status = 301
  force = true
